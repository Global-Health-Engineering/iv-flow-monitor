# One-command reproducibility for the validation analysis pipeline.
#
# Sample data (the cold-clone reproducibility test):
#   docker compose up regenerate-figures-sample
#
# Real campaign data (after EXP-3 runs are in data/raw/):
#   docker compose up regenerate-figures
#
# Both services execute notebooks/validation.ipynb headlessly via
# papermill, regenerating all PNGs in analysis/figures/.

services:
  regenerate-figures-sample:
    build: .
    image: dripito-analysis:latest
    volumes:
      - ../data/sample:/work/data:ro
      - ./figures:/work/figures
    command:
      - python
      - -m
      - papermill
      - /work/notebooks/validation.ipynb
      - /work/notebooks/validation_executed.ipynb
      - --cwd
      - /work/notebooks
      - -p
      - DATA_DIR
      - /work/data
      - -p
      - FIGURES_DIR
      - /work/figures
      - -p
      - SAMPLE_MODE
      - "True"

  regenerate-figures:
    build: .
    image: dripito-analysis:latest
    volumes:
      - ../data:/work/data:ro
      - ./figures:/work/figures
    command:
      - python
      - -m
      - papermill
      - /work/notebooks/validation.ipynb
      - /work/notebooks/validation_executed.ipynb
      - --cwd
      - /work/notebooks
      - -p
      - DATA_DIR
      - /work/data
      - -p
      - FIGURES_DIR
      - /work/figures
      - -p
      - SAMPLE_MODE
      - "False"

  # A priori MC error budget — fully synthetic, no input data needed.
  # Writes fig_error_budget.png + error_budget_synthetic.csv (the cold-clone
  # sample) so the prediction is reproducible from a fresh git clone before
  # any bench data exists.
  regenerate-error-budget:
    build: .
    image: dripito-analysis:latest
    volumes:
      - ../data/sample:/work/data/sample
      - ./figures:/work/figures
    command:
      - python
      - -m
      - papermill
      - /work/notebooks/error_budget.ipynb
      - /work/notebooks/error_budget_executed.ipynb
      - --cwd
      - /work/notebooks
      - -p
      - FIGURES_DIR
      - /work/figures
      - -p
      - SAMPLE_DIR
      - /work/data/sample
